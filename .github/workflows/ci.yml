name: Validate car analysis

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
      - run: Rscript -e 'install.packages(c("tidyverse", "ggplot2", "corrplot", "car"), repos="https://cloud.r-project.org")'
      - run: Rscript --vanilla tests/smoke.R
